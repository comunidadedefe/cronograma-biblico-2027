<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f4f1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>Cronograma Bíblico 2027</title>
  <link rel="manifest" href="manifest.webmanifest?v=lamb1">
  <link rel="icon" href="icon.svg?v=lamb1" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg?v=lamb1">
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="enhancements.css" />
  <link rel="stylesheet" href="visual-v5.css?v=12" />
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">CRONOGRAMA BÍBLICO</div>
        <h1>2027</h1>
      </div>
      <div class="top-actions">
        <button class="icon-btn push-off" id="pushToggle" aria-pressed="false" aria-label="Ativar notificações" title="Notificações desativadas">
          <svg class="top-icon push-bell" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 8a6 6 0 0 0-10.2-4.3" />
            <path d="M6 8c0 7-3 7-3 9h14" />
            <path d="M10 21h4" />
            <path d="M3 3l18 18" />
          </svg>
        </button>
        <button class="icon-btn" id="jumpToday" aria-label="Início" title="Início">
          <svg class="top-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5" />
            <path d="M5.5 9.5V20h13V9.5" />
            <path d="M9 20v-6h6v6" />
          </svg>
        </button>
        <button class="icon-btn theme-toggle" id="themeToggle" aria-label="Alternar modo claro e escuro" title="Alternar tema">
          <span class="theme-icon theme-icon-sun" aria-hidden="true">
            <svg class="top-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3.5" />
              <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42" />
            </svg>
          </span>
          <span class="theme-icon theme-icon-moon" aria-hidden="true">
            <svg class="top-icon" viewBox="0 0 24 24">
              <path d="M20 15.1A8 8 0 0 1 8.9 4a8.2 8.2 0 1 0 11.1 11.1Z" />
            </svg>
          </span>
        </button>
      </div>
    </header>

    <main id="app"></main>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <button data-view="today" class="nav-item active"><span class="nav-icon">⌂</span><span>Hoje</span></button>
      <button data-view="calendar" class="nav-item"><span class="nav-icon">▦</span><span>Calendário</span></button>
      <button data-view="timeline" class="nav-item"><span class="nav-icon">⌘</span><span>Linha do Tempo</span></button>
      <button data-view="progress" class="nav-item"><span class="nav-icon">▥</span><span>Progresso</span></button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="calendar-data-2027.js"></script>
  <script src="banner-data/chunk01.js"></script>
  <script src="banner-data/chunk02.js"></script>
  <script src="banner-data/chunk03.js"></script>
  <script src="banner-data/chunk04.js"></script>
  <script src="banner-data/chunk05.js"></script>
  <script src="banner-data/chunk06.js"></script>
  <script src="banner-data/chunk07.js"></script>
  <script src="banner-data/chunk08.js"></script>
  <script src="banner-data/init.js"></script>
  <script src="app.js"></script>
  <script src="calendar-2027.js"></script>
  <script src="visual-v5.js?v=10"></script>
  <script src="onesignal.js?v=3"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(reg => reg && reg.update()).catch(() => {});
    }
  </script>
</body>
</html>
